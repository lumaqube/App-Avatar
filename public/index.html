<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QBooth Avatar</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/",
        "@pixiv/three-vrm": "/vendor/three-vrm/three-vrm.module.js"
      }
    }
  </script>
</head>
<body>
  <!-- only the character: QBooth's event screen around it is the screen -->
  <canvas id="stage"></canvas>
  <!-- "thinking…": from the guest's last word until the answer's first sentence -->
  <div id="think" class="think" hidden><i></i><i></i><i></i></div>

  <div id="debug" class="debug" hidden>
    <div><span id="dot" class="dot"></span> <b id="conn">…</b></div>
    <div id="dbgState"></div>
    <div id="dbgAi"></div>
    <div id="dbgMic"></div>
    <div id="dbgTime"></div>
    <div id="dbgHeard"></div>
    <div id="dbgSaid"></div>
    <div id="dbgLast" class="last"></div>
    <div class="hint">tap = talk · hold 5 s = settings · Ctrl+Alt+Shift+S / P / Q</div>
  </div>

  <!-- two buttons, each placed on its own (layout.js): the language, the menu (settings) -->
  <button id="langBtn" class="fab" type="button" aria-label="Language" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-2.9a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8zM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4zM4.3 14a8.2 8.2 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4H4.3zm.8 2h2.9c.3 1.3.8 2.5 1.4 3.6A8 8 0 0 1 5.1 16zM8 8H5.1a8 8 0 0 1 4.3-3.6C8.8 5.5 8.3 6.7 8 8zm4 12c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4zm.3 5.6c.6-1.1 1.1-2.3 1.4-3.6h2.9a8 8 0 0 1-4.3 3.6zm1.7-5.6a16.5 16.5 0 0 0 0-4h3.4a8.2 8.2 0 0 1 0 4h-3.4z"/></svg>
  </button>
  <button id="menuBtn" class="fab" type="button" aria-label="Menu" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
  </button>
  <div id="langPop" class="lang-pop" hidden></div>

  <div id="boot" class="boot" hidden></div>
  <div id="activate" class="overlay tap" hidden></div>

  <script type="module" src="main.js"></script>
</body>
</html>
